<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Varela+Round&display=swap"
    rel="stylesheet" />
  <title>Unit Convertor</title>
</head>

<body class="varela-round-regular">
  <h2>UNIT CONVERTER</h2>
  <div id="display-data">
     
    <div id="menu">
      #<span id="change-mode">Length</span>
    </div>
    <div id="convert-data-box">

      <div id="first-data-manipulation" class="data-manipulation">
        <input type="text" inputmode="numeric" placeholder="0">
        <select name="units" id="select-unit-first">
          <option value="inch">Inches</option>
        </select>
      </div>

      <div id="second-data-manipulation" class="data-manipulation">
        <input type="text" inputmode="numeric" placeholder="0">
        <select name="units" id="select-unit-second">
          <option value="inch">Inches</option>
        </select>
      </div>

    </div> 

    <div id="numbers-button-container">
      <button id="clear-all" class="btn" grid-area="ce">CE</button>
      <button id="delete" class="btn" grid-area="delete">X</button>
      <button id="a1" class="btn" style="grid-area: a1">1</button>
      <button id="a2" class="btn" style="grid-area: a2">2</button>
      <button id="a3" class="btn" style="grid-area: a3">3</button>
      <button id="a4" class="btn" style="grid-area: a4">4</button>
      <button id="a5" class="btn" style="grid-area: a5">5</button>
      <button id="a6" class="btn" style="grid-area: a6">6</button>
      <button id="a7" class="btn" style="grid-area: a7">7</button>
      <button id="a8" class="btn" style="grid-area: a8">8</button>
      <button id="a9" class="btn" style="grid-area: a9">9</button>
      <button id="a0" class="btn" style="grid-area: a0">0</button>
      <button id="dot" class="btn" style="grid-area: dot">.</button>
    </div>

  </div>



  <script src="script.js"></script>
</body>

</html>
